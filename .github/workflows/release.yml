name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package-release.ps1 -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: usage-overlay-${{ github.ref_name }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath .\artifacts\release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $files `
            --title "Usage Overlay $env:GITHUB_REF_NAME" `
            --generate-notes
